<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞书智能助手 - 综合控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 1000px;
            height: 80vh;
            background: #1e1e2e;
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .app-title {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .app-title svg {
            width: 28px;
            height: 28px;
        }

        .function-tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }

        /* 状态指示器 */
        .status-indicators {
            display: flex;
            gap: 15px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .status-dot.warning {
            background: #f59e0b;
            box-shadow: 0 0 10px #f59e0b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* 消息区域 */
        .message-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-area::-webkit-scrollbar {
            width: 6px;
        }

        .message-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .message-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        /* 消息气泡 */
        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.6;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            border-bottom-left-radius: 6px;
        }

        .message.system {
            align-self: center;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            padding: 8px 16px;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border-left: 3px solid #ef4444;
            border-radius: 6px;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .message-header .tool-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .tool-icon.sql {
            background: #3b82f6;
        }

        .tool-icon.rag {
            background: #10b981;
        }

        .tool-icon.web {
            background: #8b5cf6;
        }

        .tool-icon.stream {
            background: #f59e0b;
        }

        .message-content {
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .message-content code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
        }

        /* 输入区域 */
        .input-area {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper textarea {
            width: 100%;
            padding: 12px 50px 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            color: white;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
            min-height: 48px;
            max-height: 150px;
        }

        .input-wrapper textarea:focus {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.1);
        }

        .input-wrapper textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .input-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .action-btn.send {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }

        .action-btn.send:hover {
            transform: scale(1.05);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* 功能说明 */
        .feature-hints {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
            padding-left: 5px;
        }

        .hint-tag {
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .hint-tag.active {
            background: rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
        }

        /* 加载动画 */
        .loading-dots {
            display: inline-flex;
            gap: 3px;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background: #6366f1;
            border-radius: 50%;
            animation: loading-bounce 1.4s infinite ease-in-out;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: 0s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes loading-bounce {

            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 工具结果卡片 */
        .tool-result {
            margin-top: 10px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .tool-result.success {
            border-left: 3px solid #10b981;
        }

        .tool-result.error {
            border-left: 3px solid #ef4444;
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .main-container {
                height: 95vh;
                border-radius: 12px;
            }

            .tab-btn {
                padding: 6px 12px;
                font-size: 0.75rem;
            }

            .message {
                max-width: 95%;
            }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <!-- 顶部导航 -->
        <div class="top-bar">
            <div class="app-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z" />
                    <path d="M2 17l10 5 10-5" />
                    <path d="M2 12l10 5 10-5" />
                </svg>
                <span>飞书智能助手</span>
            </div>

            <div class="status-indicators">
                <div class="status-dot" title="服务在线"></div>
            </div>
        </div>

        <!-- 消息区域 -->
        <div class="message-area" id="messageArea">
            <div class="message system">
                <span>欢迎使用飞书智能助手！输入您的问题开始对话。</span>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="input-area">
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea id="inputMessage" placeholder="输入您的问题..." rows="1"></textarea>
                </div>
                <div class="input-actions">
                    <button class="action-btn" id="btnClear" title="清空">✕</button>
                    <button class="action-btn send" id="btnSend" title="发送">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Token管理
        let authToken = localStorage.getItem('auth_token') || '';

        // 获取或刷新Token
        async function getAuthToken() {
            if (!authToken) {
                try {
                    const response = await fetch('/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'username=admin&password=password'
                    });
                    const data = await response.json();
                    if (data.access_token) {
                        authToken = data.access_token;
                        localStorage.setItem('auth_token', authToken);
                    }
                } catch (error) {
                    console.error('获取Token失败:', error);
                }
            }
            return authToken;
        }

        // 消息区域
        const messageArea = document.getElementById('messageArea');
        const inputMessage = document.getElementById('inputMessage');
        const btnSend = document.getElementById('btnSend');
        const btnClear = document.getElementById('btnClear');

        // 添加消息
        function addMessage(content, type = 'bot') {
            const message = document.createElement('div');
            message.className = `message ${type}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            message.appendChild(contentDiv);

            messageArea.appendChild(message);
            messageArea.scrollTop = messageArea.scrollHeight;
            return message;
        }

        // 发送消息 - 使用流式输出
        async function sendMessage() {
            const query = inputMessage.value.trim();
            if (!query) return;

            // 添加用户消息
            addMessage(query, 'user');

            // 清空输入
            inputMessage.value = '';
            btnSend.disabled = true;

            // 添加bot消息容器（用于流式输出）
            const botMsg = document.createElement('div');
            botMsg.className = 'message bot';
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = '';
            botMsg.appendChild(contentDiv);
            messageArea.appendChild(botMsg);
            messageArea.scrollTop = messageArea.scrollHeight;

            try {
                // 调用流式API
                await streamRequest(query, contentDiv);
            } catch (error) {
                contentDiv.textContent = `❌ 错误：${error.message}`;
            } finally {
                btnSend.disabled = false;
                messageArea.scrollTop = messageArea.scrollHeight;
            }
        }

        // 流式请求函数（带Token认证）
        async function streamRequest(query, contentDiv) {
            // 获取Token
            const token = await getAuthToken();

            const headers = {
                'Content-Type': 'application/json'
            };

            // 如果有Token，添加到请求头
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const response = await fetch('/api/stream/all', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ query, type: 'stream' })
            });

            // 如果Token过期，尝试重新获取
            if (response.status === 401) {
                authToken = '';
                localStorage.removeItem('auth_token');
                const newToken = await getAuthToken();
                if (newToken) {
                    headers['Authorization'] = `Bearer ${newToken}`;
                    return streamRequest(query, contentDiv); // 重试
                }
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');

            let done = false;
            let isFirstChunk = true;

            while (!done) {
                const { value, done: readerDone } = await reader.read();
                done = readerDone;

                if (value) {
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));

                                if (data.type === 'status') {
                                    // 状态消息，显示为提示
                                    if (isFirstChunk) {
                                        contentDiv.textContent = data.content + '...';
                                        isFirstChunk = false;
                                    }
                                } else if (data.type === 'content') {
                                    if (data.content) {
                                        // 如果是第一个内容块，替换状态提示
                                        if (isFirstChunk) {
                                            contentDiv.textContent = data.content;
                                            isFirstChunk = false;
                                        } else {
                                            contentDiv.textContent += data.content;
                                        }
                                    }
                                } else if (data.type === 'error') {
                                    contentDiv.textContent = `❌ ${data.content}`;
                                    return;
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }

                messageArea.scrollTop = messageArea.scrollHeight;
            }
        }

        // 事件监听
        btnSend.addEventListener('click', sendMessage);

        inputMessage.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        btnClear.addEventListener('click', () => {
            inputMessage.value = '';
        });

        // 自动调整输入框高度
        inputMessage.addEventListener('input', () => {
            inputMessage.style.height = 'auto';
            inputMessage.style.height = Math.min(inputMessage.scrollHeight, 150) + 'px';
        });

        // 检查服务状态
        async function checkStatus() {
            try {
                const response = await fetch('/health');
                if (response.ok) {
                    document.querySelector('.status-dot').classList.remove('warning');
                }
            } catch {
                document.querySelector('.status-dot').classList.add('warning');
            }
        }

        checkStatus();
        setInterval(checkStatus, 10000);
    </script>
</body>

</html>
